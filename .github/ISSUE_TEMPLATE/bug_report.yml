name: Bug report
description: Report a problem with QuotaPulse.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve QuotaPulse. Please remove any personal account details, tokens, or local paths from screenshots or logs."
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaPulse version
      placeholder: "Example: v0.2.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: "Describe the problem and what you expected instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open QuotaPulse\n2. ...\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: "Attach screenshots or logs if helpful. Remove tokens, account IDs, email addresses, and other private data first."
