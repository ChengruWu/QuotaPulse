name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QUOTAFLOAT_UPDATER_PUBLIC_KEY: ${{ vars.QUOTAFLOAT_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate release configuration
        shell: pwsh
        run: |
          if (-not $env:QUOTAFLOAT_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the updater public key and signing private key before releasing.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match package.json version.' }
          $configKey = (Get-Content src-tauri/tauri.release.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if ($configKey -ne $env:QUOTAFLOAT_UPDATER_PUBLIC_KEY.Trim()) { throw 'tauri.release.conf.json pubkey must match QUOTAFLOAT_UPDATER_PUBLIC_KEY.' }
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuotaPulse ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
