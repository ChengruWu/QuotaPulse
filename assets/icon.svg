<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="124"/>
    </clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="48%" stop-color="#5B4CE6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow-tl" cx="20%" cy="16%" r="58%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br" cx="84%" cy="86%" r="56%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8F8FF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow-tl)"/>
    <rect width="512" height="512" fill="url(#glow-br)"/>
    <rect x="4" y="4" width="504" height="504" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="8"/>

    <!-- Subtle depth shadow for quota ring and pulse -->
    <g transform="translate(0 10)" opacity="0.22">
      <path d="M 256 98 A 158 158 0 1 1 98 256" fill="none" stroke="#0F172A" stroke-width="36" stroke-linecap="round"/>
      <path d="M 160 256 L 202 256 L 232 182 L 280 330 L 310 256 L 352 256" fill="none" stroke="#0F172A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Full quota track -->
    <circle cx="256" cy="256" r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="36"/>

    <!-- Active 75% quota progress arc (12 o'clock clockwise to 9 o'clock) -->
    <path d="M 256 98 A 158 158 0 1 1 98 256" fill="none" stroke="url(#arc-grad)" stroke-width="36" stroke-linecap="round"/>

    <!-- Centered QuotaPulse waveform -->
    <path d="M 160 256 L 202 256 L 232 182 L 280 330 L 310 256 L 352 256" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
